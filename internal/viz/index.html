<!doctype html>
<html lang="en" data-direction="biolum" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wk hive</title>
<script>
// Set the direction and the light or dark mode before the first paint, so the page never flashes
// the wrong palette. The direction comes from ?d=, then the saved choice, then the default.
const DIRECTIONS = ["apiary", "blueprint", "biolum", "bauhaus"];
let modePref = "";
(function () {
  let d = "biolum";
  try { d = localStorage.getItem("wk.direction") || d; modePref = localStorage.getItem("wk.mode") || ""; } catch (e) {}
  const q = new URLSearchParams(location.search).get("d");
  if (q) d = q;
  if (!DIRECTIONS.includes(d)) d = "biolum";
  document.documentElement.dataset.direction = d;
  applyMode();
})();
function applyMode() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.mode = modePref || (dark ? "dark" : "light");
}
</script>
<style>
  /* Each direction sets the same tokens for light and dark. The verdict hues keep one meaning in
     every direction (green working, amber kept, red landing, gray removable, blue skipped), so a
     switch changes the mood and never the reading. */
  :root, [data-direction="apiary"] {
    --hero: url("assets/apiary-hero.webp"); --tex: url("assets/apiary-tex.webp");
    --tex-op: .9; --tex-filter: none; --hero-filter: none; --hero-op: 1;
    --bg: #f4ead6; --ink: #2b2014; --muted: #7a6650; --panel: rgba(255, 250, 238, .82);
    --line: #dcc9a6; --accent: #b9770e; --hub: #3a2a16; --hub-ink: #f2c14e;
    --working: #4c8a3c; --idle: #d4961f; --land: #c4532e; --removable: #a39a8a; --skip: #3f6fae; --prunable: #c9bda4;
    --cell-ink: #fffaf0; --cell-halo: rgba(43, 32, 20, .55); --cell-stroke: var(--bg); --cell-sw: 2;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif; --font-cell: var(--font-body);
    --display-weight: 600; --display-case: none; --display-track: .01em; --radius: 14px;
    --plate: "Fig. 1. The colony";
  }
  [data-direction="apiary"][data-mode="dark"] {
    --tex-op: .06; --hero-filter: brightness(.62) sepia(.25) contrast(1.1); --hero-op: .9;
    --bg: #17110a; --ink: #f3e6cc; --muted: #a8936f; --panel: rgba(34, 25, 15, .86);
    --line: #4a3923; --accent: #f2b544; --hub: #f2c14e; --hub-ink: #2a1d0c;
    --working: #6fbf5a; --idle: #e6a832; --land: #e86f45; --removable: #7d7465; --skip: #6c9be0; --prunable: #5a5040;
    --cell-halo: rgba(0, 0, 0, .6);
  }
  [data-direction="blueprint"] {
    --hero: url("assets/blueprint-hero.webp"); --tex: url("assets/blueprint-tex.webp");
    --tex-op: .55; --tex-filter: invert(1) hue-rotate(180deg); --hero-filter: invert(1) hue-rotate(180deg); --hero-op: .9;
    --bg: #f3f7fc; --ink: #0d2c5e; --muted: #4f6d96; --panel: rgba(255, 255, 255, .86);
    --line: #9db8dc; --accent: #1d5fbf; --hub: #0d2c5e; --hub-ink: #f3f7fc;
    --working: #12895a; --idle: #b7800b; --land: #c9402f; --removable: #7d8ea6; --skip: #1d5fbf; --prunable: #a8b6c9;
    --cell-ink: var(--ink); --cell-halo: var(--bg); --cell-sw: 2;
    --font-display: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --font-body: var(--font-display);
    --font-cell: var(--font-display); --display-weight: 600; --display-case: uppercase; --display-track: .14em;
    --radius: 2px; --plate: "SHEET 01 / HIVE PLAN";
  }
  [data-direction="blueprint"][data-mode="dark"] {
    --tex-op: 1; --tex-filter: none; --hero-filter: none; --hero-op: 1;
    --bg: #0b2a5c; --ink: #e6f1ff; --muted: #8fb3e0; --panel: rgba(10, 36, 80, .8);
    --line: #3e6db0; --accent: #7fd6ff; --hub: #e6f1ff; --hub-ink: #0b2a5c;
    --working: #6ef0a8; --idle: #ffd166; --land: #ff7a6b; --removable: #a9bcd6; --skip: #7fd6ff; --prunable: #6b84a8;
  }
  [data-direction="biolum"] {
    --hero: radial-gradient(ellipse 60% 75% at 30% 45%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%),
      radial-gradient(circle at 55% 80%, color-mix(in srgb, var(--land) 14%, transparent), transparent 45%);
    --tex: url("assets/biolum-tex.webp");
    --tex-op: .3; --tex-filter: invert(1); --hero-filter: none; --hero-op: 1;
    --bg: #eaf6f6; --ink: #0b3036; --muted: #4d7a80; --panel: rgba(255, 255, 255, .72);
    --line: #b5dcdc; --accent: #0f9d8f; --hub: #0b3036; --hub-ink: #8ff5e8;
    --working: #12a37a; --idle: #c98a12; --land: #d64570; --removable: #8aa3a8; --skip: #2f7fd1; --prunable: #b6cccf;
    --cell-ink: var(--ink); --cell-halo: var(--bg); --cell-sw: 1.5;
    --font-display: "Avenir Next", "Segoe UI", system-ui, sans-serif; --font-body: var(--font-display);
    --font-cell: var(--font-display); --display-weight: 300; --display-case: lowercase; --display-track: .12em;
    --radius: 20px; --plate: "specimen tank 01"; --abyss: #0b3036;
  }
  [data-direction="biolum"][data-mode="dark"] {
    --tex-op: 1; --tex-filter: none; --abyss: #03151a;
    --bg: #041014; --ink: #d8fbff; --muted: #6fa5ad; --panel: rgba(6, 26, 32, .74);
    --line: #12424a; --accent: #5ef2e0; --hub: #0b2b33; --hub-ink: #5ef2e0;
    --working: #54f0b0; --idle: #ffc65c; --land: #ff6f91; --removable: #6d8a92; --skip: #6ab8ff; --prunable: #34525a;
  }
  [data-direction="bauhaus"] {
    --hero: url("assets/bauhaus-hero.webp"); --tex: url("assets/bauhaus-tex.webp");
    --tex-op: .9; --tex-filter: none; --hero-filter: none; --hero-op: 1;
    --bg: #f1e9d6; --ink: #111111; --muted: #555049; --panel: #f8f2e3;
    --line: #111111; --accent: #d6311f; --hub: #111111; --hub-ink: #f4c21b;
    --working: #2e8b57; --idle: #f4c21b; --land: #d6311f; --removable: #9d968a; --skip: #1f4fa3; --prunable: #cfc6b2;
    --cell-ink: #ffffff; --cell-halo: #111111; --cell-stroke: var(--line); --cell-sw: 3;
    --font-display: Futura, "Futura PT", "Century Gothic", "Avenir Next", sans-serif; --font-body: var(--font-display);
    --font-cell: var(--font-display); --display-weight: 800; --display-case: uppercase; --display-track: .06em;
    --radius: 0; --plate: "HIVE / 01";
  }
  [data-direction="bauhaus"][data-mode="dark"] {
    --tex-op: .08; --tex-filter: invert(1) hue-rotate(180deg); --hero-filter: invert(1) hue-rotate(180deg);
    --bg: #121110; --ink: #f1e9d6; --muted: #a59d8c; --panel: #1c1a17;
    --line: #f1e9d6; --accent: #f4c21b; --hub: #f1e9d6; --hub-ink: #121110;
    --working: #3fb071; --idle: #f4c21b; --land: #e5432e; --removable: #6f6a61; --skip: #3a6fd1; --prunable: #3a3631;
    --cell-halo: #000000; --cell-stroke: #000000;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--font-body); transition: background-color .3s, color .3s;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: var(--tex) repeat; background-size: 512px; opacity: var(--tex-op); filter: var(--tex-filter);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 24px; }

  .masthead {
    position: relative; overflow: hidden; margin: 16px 0 14px; padding: 26px 24px 20px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); min-height: 190px;
  }
  .hero {
    position: absolute; inset: 0 0 0 auto; width: min(62%, 720px); pointer-events: none;
    background: var(--hero) left center / cover no-repeat; filter: var(--hero-filter); opacity: var(--hero-op);
    -webkit-mask-image: linear-gradient(to left, transparent 0, #000 38%);
    mask-image: linear-gradient(to left, transparent 0, #000 38%);
    transform: scaleX(-1);
  }
  .brand, .status, .controls { position: relative; }
  .brand { display: flex; gap: 14px; align-items: center; }
  .mark { width: 44px; height: 44px; flex: none; color: var(--accent); }
  h1 {
    margin: 0; font: var(--display-weight) 34px/1.05 var(--font-display);
    text-transform: var(--display-case); letter-spacing: var(--display-track);
  }
  .tag { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 34ch; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 16px 0 14px; color: var(--muted); font-size: 12px; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--working); box-shadow: 0 0 0 3px color-mix(in srgb, var(--working) 25%, transparent); }
  .live.off i { background: var(--removable); box-shadow: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: calc(var(--radius) / 2 + 6px); overflow: hidden; background: var(--panel); }
  .seg button, .mode {
    font: 12px/1 var(--font-body); color: var(--ink); background: transparent; border: 0;
    padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
  .seg button:focus-visible, .mode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .mode { border: 1px solid var(--line); border-radius: calc(var(--radius) / 2 + 6px); background: var(--panel); }

  .counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; align-items: center; }
  .key-title {
    font: var(--display-weight) 12px var(--font-display); color: var(--muted);
    text-transform: uppercase; letter-spacing: .12em; margin-right: 2px;
  }
  .chip .beh { color: var(--muted); }
  .chip svg { width: 30px; height: 22px; flex: none; overflow: visible; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink);
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  }
  .chip.zero { opacity: .45; }
  .chip b { font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  [data-direction="bauhaus"] .chip, [data-direction="bauhaus"] .dot { border-radius: 0; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .hero { width: 100%; opacity: calc(var(--hero-op) * .35); }
    h1 { font-size: 28px; }
  }
  .stage, aside { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .stage { position: relative; min-height: 360px; overflow: hidden; display: grid; place-items: center; padding: 8px 8px 28px; }
  .stage::after {
    content: var(--plate); position: absolute; right: 12px; bottom: 10px;
    font: 11px/1 var(--font-display); color: var(--muted); letter-spacing: .08em;
  }
  [data-direction="blueprint"] .stage::after { border: 1px solid var(--line); padding: 6px 8px; }
  [data-direction="bauhaus"] .stage, [data-direction="bauhaus"] aside, [data-direction="bauhaus"] .masthead { border-width: 3px; }
  svg { width: 100%; height: auto; display: block; }
  #hive { max-height: min(460px, 70vh); }

  .cell { cursor: pointer; outline: none; }
  .cell .hex { fill: var(--c); stroke: var(--cell-stroke); stroke-width: var(--cell-sw); transition: fill .3s, stroke .3s; }
  .cell text {
    font: 600 9.5px var(--font-cell); fill: var(--cell-ink); pointer-events: none;
    paint-order: stroke; stroke: var(--cell-halo); stroke-width: 2.5px; stroke-linejoin: round;
  }
  .cell text.sub { font-size: 8.5px; font-weight: 500; }
  .cell:hover .hex, .cell:focus .hex { stroke-width: calc(var(--cell-sw) + 1.5); }
  .cell.selected .hex { stroke: var(--ink); stroke-width: calc(var(--cell-sw) + 2); }
  .cell:focus-visible .hex { stroke: var(--accent); stroke-width: calc(var(--cell-sw) + 2.5); }
  .cell[data-k="prunable"] .hex { stroke-dasharray: 5 4; }
  [data-direction="blueprint"] .cell .hex { fill-opacity: .16; stroke: var(--c); }
  [data-direction="blueprint"] .cell text { text-transform: uppercase; }
  [data-direction="biolum"] .cell .hex { fill-opacity: .24; stroke: var(--c); filter: drop-shadow(0 0 6px var(--c)); }
  [data-direction="bauhaus"] .cell text { text-transform: uppercase; font-weight: 800; }
  .hub { fill: var(--hub); stroke: var(--accent); stroke-width: 2; }
  [data-direction="biolum"] .hub { filter: drop-shadow(0 0 10px var(--hub-ink)); }
  .hub-ring { fill: none; stroke: var(--hub-ink); stroke-width: 1; opacity: .5; }
  .hub-text { font: 700 12px var(--font-cell); fill: var(--hub-ink); }
  .hub-cap { font: 9px var(--font-cell); fill: var(--hub-ink); opacity: .75; letter-spacing: .12em; }
  .empty-note { font: 13px var(--font-body); fill: var(--muted); }

  /* Bees: one per worktree, in its verdict color. How a bee moves says the same thing as its
     color, so the hive reads at a glance even for a viewer who cannot tell the colors apart. */
  #swarm { pointer-events: none; }
  #swarm .bee { filter: drop-shadow(0 0 1.4px var(--bg)) drop-shadow(0 0 .6px var(--bg)); }
  .bee .body { fill: var(--c); stroke: var(--bee-line); stroke-width: .8; }
  .bee .stripe { stroke: var(--bee-line); stroke-width: 1.6; stroke-linecap: round; fill: none; }
  .bee .head { fill: var(--bee-line); }
  .bee .wing {
    fill: var(--bee-wing); stroke: var(--bee-line); stroke-width: .5; stroke-opacity: .5;
    transform-box: fill-box; transform-origin: 50% 100%; animation: flap .09s ease-in-out infinite alternate;
  }
  .bee .wing.w2 { animation-delay: -.045s; }
  .bee[data-k="idle"] .wing, .bee[data-k="skip"] .wing { animation-duration: .22s; }
  .bee[data-k="removable"] .wing { animation: none; transform: scaleY(.55); }
  .bee[data-k="prunable"] { opacity: .5; }
  .bee .zz { font: 700 7px var(--font-body); fill: var(--muted); stroke: none; opacity: 0; }
  .bee[data-k="removable"] .zz { animation: zz 2.4s ease-out infinite; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -12px); } }
  :root { --bee-line: #2a1d0c; --bee-wing: rgba(255, 255, 255, .78); }
  [data-mode="dark"] { --bee-wing: rgba(255, 255, 255, .55); --bee-line: #140e06; }
  [data-direction="blueprint"] .bee .body { fill-opacity: .25; stroke: var(--c); stroke-width: 1.1; }
  [data-direction="blueprint"] .bee .stripe, [data-direction="blueprint"] .bee .head { stroke: var(--c); fill: var(--c); }
  [data-direction="blueprint"] .bee .wing { fill: none; stroke: var(--ink); stroke-opacity: .8; }
  /* Bioluminescent: the bees are deep-water aliens with a light core, four veined wings and a
     trail of light. */
  [data-direction="biolum"] .bee, [data-direction="biolum"] #swarm .bee { filter: drop-shadow(0 0 3px var(--c)); }
  .trail { display: none; }
  [data-direction="biolum"] .trail { display: inline; }
  .trail circle { fill: var(--c); }
  .alien .awing {
    fill: var(--c); fill-opacity: .13; stroke: var(--c); stroke-opacity: .75; stroke-width: .45;
    transform-box: fill-box; animation: flap .12s ease-in-out infinite alternate;
  }
  .alien .awing.up { transform-origin: 35% 100%; }
  .alien .awing.down { transform-origin: 35% 0%; animation-delay: -.06s; }
  .alien .vein, .alien .seg { fill: none; stroke: var(--c); stroke-opacity: .55; stroke-width: .35; }
  .alien .abd { fill: var(--c); fill-opacity: .26; stroke: var(--c); stroke-width: .7; }
  .alien .core {
    fill: #effffc; filter: drop-shadow(0 0 1.5px var(--c)) drop-shadow(0 0 4px var(--c));
    transform-box: fill-box; transform-origin: center; animation: core 1.7s ease-in-out infinite;
  }
  .alien .thorax, .alien .head { fill: var(--abyss); stroke: var(--c); stroke-width: .7; }
  .alien .eye, .alien .spot { fill: #effffc; }
  .alien .spot { filter: drop-shadow(0 0 1px var(--c)); opacity: .85; }
  .alien .tail { fill: none; stroke: var(--c); stroke-width: .35; stroke-opacity: .6; stroke-linecap: round; }
  .alien .ant { fill: none; stroke: var(--c); stroke-width: .4; stroke-linecap: round; stroke-opacity: .9; }
  .alien .tip { fill: #effffc; filter: drop-shadow(0 0 1.5px var(--c)); }
  .bee[data-k="idle"] .awing, .bee[data-k="skip"] .awing { animation-duration: .3s; }
  .bee[data-k="removable"] .awing { animation: none; transform: scaleY(.45); }
  .bee[data-k="removable"] .core, .bee[data-k="removable"] .spot { animation: none; opacity: .2; }
  .bee[data-k="prunable"] .abd, .bee[data-k="prunable"] .awing { stroke-dasharray: 1.5 1.2; }
  @keyframes core { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.7); } }
  [data-direction="bauhaus"] .bee .body { stroke: var(--line); stroke-width: 1.4; }
  [data-direction="bauhaus"] .bee .stripe { stroke-width: 2.4; stroke-linecap: butt; stroke: #111; }
  [data-direction="bauhaus"] .bee .head { fill: #111; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .bee .wing, .alien .awing, .alien .core, .bee[data-k="removable"] .zz { animation: none; }
    body { transition: none; }
  }

  aside { padding: 16px; align-self: start; }
  aside h2 { font: var(--display-weight) 16px/1.3 var(--font-display); margin: 0 0 8px; word-break: break-all; }
  aside dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0; font-size: 12px; }
  aside dt { color: var(--muted); }
  aside dd { margin: 0; word-break: break-word; }
  aside ul { padding-left: 18px; margin: 6px 0 0; font-size: 12px; }
  aside .why { font-size: 12px; font-weight: 700; text-transform: var(--display-case); letter-spacing: var(--display-track); }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
  .error { color: var(--land); font-size: 12px; margin: 0 0 12px; }
  footer { color: var(--muted); font-size: 11px; margin-top: 14px; }
  footer code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="hero" aria-hidden="true"></div>
    <div class="brand">
      <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
        <polygon points="22,3 38.5,12.5 38.5,31.5 22,41 5.5,31.5 5.5,12.5" fill="none" stroke="currentColor" stroke-width="3"/>
        <polygon points="22,13 30,17.5 30,26.5 22,31 14,26.5 14,17.5" fill="currentColor"/>
      </svg>
      <div>
        <h1>wk hive</h1>
        <p class="tag">Warm worktrees for parallel agents, and a clear verdict on every one.</p>
      </div>
    </div>
    <div class="status">
      <span class="live off" id="live"><i></i><span id="liveText">connecting</span></span>
      <span id="base"></span>
      <span id="stamp"></span>
    </div>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="Artistic direction" id="dirs"></div>
      <button class="mode" id="mode" type="button" aria-label="Color mode"></button>
    </div>
  </header>

  <div class="counts" id="counts"></div>
  <p class="error" id="error" hidden></p>
  <main>
    <section class="stage"><svg id="hive" viewBox="0 0 600 520" role="img" aria-label="Worktree hive"><text class="empty-note" x="300" y="260" text-anchor="middle">Reading the worktrees...</text></svg></section>
    <aside id="detail"><p class="empty">Select a cell to see why it is kept or removable.</p></aside>
  </main>
  <footer id="footer"></footer>
</div>

<script>
// Sample data: the shape of `wk gc --json`. Used only when gc.json cannot be fetched.
const SAMPLE = {
  base: "main",
  generated: new Date().toISOString(),
  removable: 2,
  worktrees: [
    { path: ".claude/worktrees/wk-41", branch: "wk/41", head: "a1b2c3d", verdict: "kept", reasons: ["it changed 3 minutes ago, so a session may still be in it", "3 changed paths"], dirty: 3, last_activity: new Date(Date.now() - 3*60e3).toISOString(), delete_branch: false },
    { path: ".claude/worktrees/wk-44", branch: "wk/44", head: "e4f5a6b", verdict: "kept", reasons: ["a process is working in it: claude (pid 8121)"], dirty: 0, last_activity: new Date(Date.now() - 40*60e3).toISOString(), delete_branch: false },
    { path: ".claude/worktrees/wk-38", branch: "wk/38", head: "c7d8e9f", verdict: "kept, run /land-worktrees", reasons: ["branch wk/38 has commits main does not hold", "4 changed paths"], dirty: 4, last_activity: new Date(Date.now() - 6*3600e3).toISOString(), delete_branch: false },
    { path: ".claude/worktrees/wk-29", branch: "wk/29", head: "0a9b8c7", verdict: "removable", reasons: ["branch wk/29 is an ancestor of main; clean and idle; the branch is deleted with it"], dirty: 0, last_activity: new Date(Date.now() - 2*86400e3).toISOString(), delete_branch: true },
    { path: ".claude/worktrees/wk-33", branch: "wk/33", head: "5d4c3b2", verdict: "removable", reasons: ["detached HEAD is an ancestor of main; clean and idle"], dirty: 0, last_activity: new Date(Date.now() - 1*86400e3).toISOString(), delete_branch: false },
    { path: ".claude/worktrees/wk-12", branch: "", head: "9f8e7d6", verdict: "skip", reasons: ["the wk template"], dirty: 0, last_activity: "", delete_branch: false },
    { path: ".claude/worktrees/wk-7", branch: "wk/7", head: "1234abc", verdict: "prunable", reasons: ["its directory is gone; git worktree prune clears the entry"], dirty: 0, last_activity: "", delete_branch: false }
  ]
};

const DIRECTION_INFO = {
  apiary: { name: "Apiary", swatch: "#d4961f" },
  blueprint: { name: "Blueprint", swatch: "#1d5fbf" },
  biolum: { name: "Bioluminescent", swatch: "#2fd6c0" },
  bauhaus: { name: "Bauhaus", swatch: "#d6311f" }
};

// Each verdict maps to one style. A kept cell with a live session reads as "working".
// internal/hive/style.go makes the same choice for the terminal view; change both together.
function styleOf(item) {
  const v = item.verdict;
  if (v === "removable") return { key: "removable", label: "removable" };
  if (v === "kept, run /land-worktrees") return { key: "land", label: "run /land-worktrees", short: "to land" };
  if (v === "skip") return { key: "skip", label: "skipped" };
  if (v === "prunable") return { key: "prunable", label: "prunable" };
  const busy = item.reasons.some(r => /changed \d+ minutes? ago|process is working/.test(r));
  if (busy) return { key: "working", label: "working" };
  return { key: "idle", label: "kept" };
}

// The key: each style's label and what its bee does.
const STYLES = [
  ["working", "working now", "circles its cell"], ["idle", "kept", "hovers"],
  ["land", "run /land-worktrees", "carries to the hub"], ["removable", "removable", "asleep"],
  ["skip", "skipped", "parked"], ["prunable", "prunable", "fading"]
];

// Honeycomb layout: the hub sits at the centre, cells fill rings outward by hex distance.
const SIZE = 38;
function ringCoords(n) {
  const out = [];
  for (let q = -8; q <= 8; q++) for (let r = -8; r <= 8; r++) {
    const d = (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2;
    if (d > 0) out.push({ q, r, d, a: Math.atan2(r + q / 2, q + 0.0001) });
  }
  out.sort((x, y) => x.d - y.d || x.a - y.a);
  return out.slice(0, n);
}
function toPixel(q, r) {
  return { x: 300 + SIZE * Math.sqrt(3) * (q + r / 2), y: 260 + SIZE * 1.5 * r };
}
function hexPoints(cx, cy, s) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push((cx + s * Math.cos(a)).toFixed(1) + "," + (cy + s * Math.sin(a)).toFixed(1));
  }
  return pts.join(" ");
}
function ago(iso) {
  if (!iso) return "unknown";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

// Controls: the direction switcher and the light, dark or automatic mode button.
function drawControls() {
  const cur = document.documentElement.dataset.direction;
  document.getElementById("dirs").innerHTML = DIRECTIONS.map(d =>
    `<button type="button" role="radio" aria-checked="${d === cur}" data-d="${d}">
       <span class="sw" style="background:${DIRECTION_INFO[d].swatch}"></span>${DIRECTION_INFO[d].name}</button>`).join("");
  document.querySelectorAll("#dirs button").forEach(b => b.addEventListener("click", () => {
    document.documentElement.dataset.direction = b.dataset.d;
    save("wk.direction", b.dataset.d);
    drawControls();
    if (current) render(current); // the new font needs a new fit
  }));
  document.getElementById("mode").textContent = "mode: " + (modePref || "auto");
}
document.getElementById("mode").addEventListener("click", () => {
  modePref = { "": "light", light: "dark", dark: "" }[modePref];
  save("wk.mode", modePref);
  applyMode();
  drawControls();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyMode);
drawControls();

let selected = null;

// One bee, facing right, about 22 units long. Wings flap by CSS; the loop moves the whole bee.
const BEE = `<ellipse class="wing" cx="-1.5" cy="-6.5" rx="4.2" ry="5.6"/><ellipse class="wing w2" cx="2.8" cy="-6" rx="3.4" ry="4.8"/>
  <ellipse class="body" cx="0" cy="0" rx="7.5" ry="5"/><path class="stripe" d="M-2.5,-4.4 v8.8 M1.5,-4.8 v9.6"/>
  <circle class="head" cx="8.6" cy="-.4" r="3.2"/><text class="zz" x="6" y="-8">z</text>`;

// The Bioluminescent alien, facing right like BEE: a long tapered abdomen with a light core and
// spots, narrow swept-back wings, a small head with filament antennae, and tail filaments.
const ALIEN = `<g class="alien">
  <path class="tail" d="M-20,0 C-24,-1.6 -27,1.4 -32,-.6 M-20,.4 C-23,2.4 -26,2 -30,3.2"/>
  <path class="awing up" d="M1,-1.6 C-3,-8 -11,-13.5 -20,-13 C-15,-9.5 -6,-4.5 1,-1.6Z"/>
  <path class="awing up" d="M2,-1.8 C2.5,-9 -1,-15 -7,-17.5 C-5.5,-11 -2,-5.5 2,-1.8Z"/>
  <path class="vein" d="M1,-1.8 C-5,-6.5 -11,-10.5 -18,-12.6 M2,-2 C1,-7 -2,-12 -6.5,-16.5"/>
  <path class="awing down" d="M1,1.6 C-3,6 -9,9.5 -15,9.5 C-11,7 -5,3.8 1,1.6Z"/>
  <path class="awing down" d="M2,1.8 C2,7 -.5,11 -4.5,12.5 C-3.5,8 -1.5,4.5 2,1.8Z"/>
  <path class="abd" d="M-1,-2.8 C-7,-4.2 -14,-3 -21,0 C-14,3 -7,4.2 -1,2.8Z"/>
  <ellipse class="core" cx="-7" cy="0" rx="4.2" ry="1.3"/>
  <circle class="spot" cx="-13.5" cy="-1.2" r=".6"/><circle class="spot" cx="-16" cy=".8" r=".5"/><circle class="spot" cx="-3.5" cy="1.6" r=".5"/>
  <ellipse class="thorax" cx="1.6" cy="0" rx="2.9" ry="2.3"/>
  <ellipse class="head" cx="5.6" cy="-.2" rx="1.9" ry="1.6"/>
  <circle class="eye" cx="6.6" cy="-.6" r=".55"/>
  <path class="ant" d="M6.4,-1.4 C8.5,-6 12,-9.5 16.5,-10.5 C18.5,-11 20,-10 20.5,-8.6"/>
  <path class="ant" d="M7,-.9 C10.5,-3.4 15,-4.4 19,-3.2 C20.5,-2.8 21.4,-1.8 21.4,-.6"/>
  <circle class="tip" cx="20.5" cy="-8.6" r=".75"/><circle class="tip" cx="21.4" cy="-.6" r=".75"/>
  <text class="zz" x="5" y="-8">z</text></g>`;
function creature() { return document.documentElement.dataset.direction === "biolum" ? ALIEN : BEE; }
const TRAIL = 8; // light dots behind each alien, every third frame back

const HUB = { x: 300, y: 260 };
const BEE_SCALE = 1.3;
const bees = new Map(); // worktree path -> { el, key, x, y, phase, px, py, heading }
const stillBees = matchMedia("(prefers-reduced-motion: reduce)");

// updateSwarm keeps one bee per worktree across reloads, so a bee keeps flying where it was
// instead of jumping every five seconds; only a new worktree gets a new bee.
function updateSwarm(list) {
  const layer = document.getElementById("swarm");
  const keep = new Set();
  list.forEach((b, i) => {
    keep.add(b.id);
    let bee = bees.get(b.id);
    if (!bee) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const dots = Array.from({ length: TRAIL }, (_, j) =>
        `<circle r="${(1.9 - j * 0.2).toFixed(2)}" opacity="${(0.55 - j * 0.065).toFixed(2)}"/>`).join("");
      el.innerHTML = `<g class="trail">${dots}</g><g class="pose"><g class="bee"></g></g>`;
      layer.appendChild(el);
      bee = { el, pose: el.lastChild, body: el.lastChild.firstChild, dots: [...el.firstChild.children],
              hist: [], phase: i * 2.399 + Math.random(), heading: 0 };
      bees.set(b.id, bee);
    }
    Object.assign(bee, { key: b.key, x: b.x, y: b.y });
    const look = creature();
    if (bee.look !== look) { bee.body.innerHTML = look; bee.look = look; }
    bee.body.dataset.k = b.key;
    bee.el.style.setProperty("--c", `var(--${b.key})`);
  });
  for (const [id, bee] of bees) if (!keep.has(id)) { bee.el.remove(); bees.delete(id); }
  if (stillBees.matches) flyAll(0);
}

// wander is smooth noise in about [-1, 1]: waves at unrelated frequencies, offset by seed, so no
// two bees fly the same path and no path visibly repeats.
function wander(t, seed) {
  return (Math.sin(t * 0.731 + seed * 1.7) + 0.6 * Math.sin(t * 1.937 + seed * 3.1)
    + 0.35 * Math.sin(t * 3.413 + seed * 5.3)) / 1.95;
}

// dart is mostly 0 with a short burst now and then, for a sudden change of course.
function dart(t, seed) {
  const w = Math.sin(t * 0.53 + seed * 2.3) * Math.sin(t * 0.29 + seed);
  return w > 0.82 ? (w - 0.82) / 0.18 : 0;
}

// beePose places one bee at time t (seconds). Each style keeps its own kind of motion (see
// STYLES), but the path inside it wanders.
function beePose(b, t) {
  const p = b.phase, r = SIZE;
  switch (b.key) {
    case "working": { // busy, erratic loops around and across its cell
      const a = p + t * (1.6 + 0.9 * wander(t * 0.4, p + 9)) + 2.4 * dart(t, p);
      const rad = r * (0.72 + 0.32 * wander(t * 0.9, p + 1));
      return { x: b.x + rad * Math.cos(a) + 6 * wander(t * 2.1, p + 2), y: b.y + rad * 0.85 * Math.sin(a) + 6 * wander(t * 2.3, p + 3), s: 1 };
    }
    case "idle": // a slow drift above the name, turning now and then
      return { x: b.x + 15 * wander(t * 0.45, p), y: b.y - r * 0.55 + 7 * wander(t * 0.6, p + 4), s: 0.9 };
    case "land": { // trips to the hub on a wobbling arc, with a rest at each end
      const raw = (Math.sin(t * 0.55 + p) + 1) / 2;
      const u = Math.min(1, Math.max(0, (raw - 0.12) / 0.76));
      const dx = HUB.x - b.x, dy = HUB.y - b.y, len = Math.hypot(dx, dy) || 1;
      const lift = (12 + 8 * wander(t * 0.3, p)) * Math.sin(Math.PI * u) + 3 * wander(t * 3, p + 5);
      const k = u * Math.max(0, 1 - (r * 0.9) / len);
      return { x: b.x + dx * k - (dy / len) * lift, y: b.y + dy * k + (dx / len) * lift, s: 0.95 };
    }
    case "removable": // asleep on the lower edge of its cell, breathing
      return { x: b.x + r * 0.32, y: b.y + r * 0.5 + 0.6 * Math.sin(t * 1.3 + p), s: 0.8, a: -0.25 };
    case "skip": // parked on top, shifting its weight
      return { x: b.x + 1.5 * wander(t * 0.3, p), y: b.y - r * 0.66 + Math.sin(t * 0.6 + p), s: 0.8, a: 0.08 * wander(t * 0.5, p + 6) };
    case "prunable": { // drifts away in a new direction each time and fades, then tries again
      const cyc = t * 0.22 + p, n = Math.floor(cyc), u = cyc - n;
      const dir = n * 2.399 + p, far = 22 + 14 * Math.abs(Math.sin(n * 7.1 + p));
      return { x: b.x + far * u * Math.cos(dir) + 3 * wander(t * 2, p), y: b.y - r * 0.2 + far * u * Math.sin(dir) * 0.7, s: 0.85, o: 0.7 * (1 - u) };
    }
  }
  return { x: b.x, y: b.y, s: 1 };
}

function flyAll(t) {
  for (const b of bees.values()) {
    const pose = beePose(b, t);
    if (pose.a === undefined && b.px !== undefined) { // face the way it moves, smoothed
      const dx = pose.x - b.px, dy = pose.y - b.py;
      if (Math.hypot(dx, dy) > 0.05) {
        const want = Math.atan2(dy, dx);
        let d = want - b.heading;
        d = Math.atan2(Math.sin(d), Math.cos(d));
        b.heading += d * 0.25;
      }
    } else if (pose.a !== undefined) b.heading = pose.a;
    b.px = pose.x; b.py = pose.y;
    const flip = Math.cos(b.heading) < 0; // keep the bee upright when it flies left
    const deg = (flip ? b.heading + Math.PI : b.heading) * 180 / Math.PI;
    const sc = pose.s * BEE_SCALE;
    b.pose.setAttribute("transform", `translate(${pose.x.toFixed(1)} ${pose.y.toFixed(1)}) rotate(${deg.toFixed(1)}) scale(${flip ? -sc : sc} ${sc})`);
    b.el.style.opacity = pose.o === undefined ? "" : pose.o.toFixed(2);
    b.hist.push(pose.x, pose.y);
    if (b.hist.length > TRAIL * 6 + 2) b.hist.splice(0, 2);
    b.dots.forEach((dot, j) => {
      const at = Math.max(0, b.hist.length - 2 - (j + 1) * 6);
      dot.setAttribute("cx", b.hist[at].toFixed(1));
      dot.setAttribute("cy", b.hist[at + 1].toFixed(1));
    });
  }
}

function frame(ms) {
  if (!stillBees.matches) flyAll(ms / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Narrow any cell label wider than its hexagon. Directions use fonts of different widths, so the
// check runs on the rendered text, after every render.
function fitText(svg) {
  const room = SIZE * 1.5;
  svg.querySelectorAll(".cell text, .hub-text").forEach(t => {
    if (t.getComputedTextLength() > room) {
      t.setAttribute("textLength", room);
      t.setAttribute("lengthAdjust", "spacingAndGlyphs");
    }
  });
}

function render(data) {
  document.getElementById("base").textContent = "base " + data.base;
  document.getElementById("stamp").textContent = "updated " + ago(data.generated);

  const styled = data.worktrees.map(it => ({ it, st: styleOf(it) }));
  const counts = {};
  styled.forEach(({ st }) => counts[st.key] = (counts[st.key] || 0) + 1);
  document.getElementById("counts").innerHTML = `<span class="key-title">Bee key</span>` + STYLES.map(([k, label, beh]) =>
    `<span class="chip${counts[k] ? "" : " zero"}"><svg viewBox="${creature() === ALIEN ? "-24 -16 46 28" : "-11 -12 23 17"}" aria-hidden="true"><g class="bee" data-k="${k}" style="--c:var(--${k})">${creature()}</g></svg><b>${counts[k] || 0}</b> ${label} <span class="beh">${beh}</span></span>`).join("");

  const svg = document.getElementById("hive");
  const slots = ringCoords(styled.length);
  // Zoom to the rings in use, so a small hive fills the stage.
  const rings = Math.max(1, ...slots.map(s => s.d));
  const halfW = SIZE * Math.sqrt(3) * (rings + 0.75), halfH = SIZE * 1.5 * (rings + 0.9);
  svg.setAttribute("viewBox", `${(300 - halfW).toFixed(1)} ${(260 - halfH).toFixed(1)} ${(2 * halfW).toFixed(1)} ${(2 * halfH).toFixed(1)}`);
  let html = `<g aria-hidden="true">
    <polygon class="hub" points="${hexPoints(300, 260, SIZE * 0.95)}"/>
    <polygon class="hub-ring" points="${hexPoints(300, 260, SIZE * 0.72)}"/>
    <text class="hub-cap" x="300" y="250" text-anchor="middle">BASE</text>
    <text class="hub-text" x="300" y="268" text-anchor="middle">${esc(clip(data.base, 10))}</text></g>`;

  styled.forEach(({ it, st }, i) => {
    const p = toPixel(slots[i].q, slots[i].r);
    const name = it.branch || it.path.split("/").pop();
    const cls = ["cell"];
    if (selected === i) cls.push("selected");
    const pulse = st.key === "working" ? " pulse" : "";
    html += `<g class="${cls.join(" ")}" tabindex="0" role="button" data-i="${i}" data-k="${st.key}" style="--c:var(--${st.key})"
        aria-label="${esc(name)}: ${esc(st.label)}">
      <polygon class="hex${pulse}" points="${hexPoints(p.x, p.y, SIZE - 3)}"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y - 2).toFixed(1)}" text-anchor="middle">${esc(clip(name, 10))}</text>
      <text class="sub" x="${p.x.toFixed(1)}" y="${(p.y + 10).toFixed(1)}" text-anchor="middle">${esc(st.short || st.label)}</text>
    </g>`;
  });
  if (!styled.length) {
    html += `<text class="empty-note" x="300" y="${(260 + SIZE * 1.9).toFixed(1)}" text-anchor="middle">No worktrees yet. wk new &lt;row&gt; makes a warm one.</text>`;
  }
  if (!svg.querySelector("#cells")) svg.innerHTML = `<g id="cells"></g><g id="swarm" aria-hidden="true"></g>`;
  const cellsLayer = svg.querySelector("#cells");
  cellsLayer.innerHTML = html;
  fitText(cellsLayer);
  updateSwarm(styled.map(({ it, st }, i) => ({ id: it.path, key: st.key, ...toPixel(slots[i].q, slots[i].r) })));
  cellsLayer.querySelectorAll(".cell").forEach(g => {
    const open = () => { selected = +g.dataset.i; render(current); svg.querySelector(`[data-i="${selected}"]`)?.focus(); };
    g.addEventListener("click", open);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });

  const detail = document.getElementById("detail");
  if (selected !== null && styled[selected]) {
    const { it, st } = styled[selected];
    detail.innerHTML = `
      <h2>${esc(it.path)}</h2>
      <span class="chip"><span class="dot" style="background:var(--${st.key})"></span>${esc(st.label)}</span>
      <dl>
        <dt>branch</dt><dd>${esc(it.branch || "detached")}</dd>
        <dt>head</dt><dd>${esc(it.head)}</dd>
        <dt>changed</dt><dd>${it.dirty} path${it.dirty === 1 ? "" : "s"}</dd>
        <dt>activity</dt><dd>${esc(ago(it.last_activity))}</dd>
        <dt>delete branch</dt><dd>${it.delete_branch ? "yes" : "no"}</dd>
      </dl>
      <span class="why">Why</span>
      <ul>${it.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
  } else {
    detail.innerHTML = `<p class="empty">Select a cell to see why it is kept or removable.</p>`;
  }
}

let current = null;
function show(data, live, error) {
  current = data;
  document.getElementById("error").hidden = !error;
  document.getElementById("error").textContent = error || "";
  document.getElementById("live").classList.toggle("off", !live);
  document.getElementById("liveText").textContent = live ? "live" : "sample data";
  document.getElementById("footer").innerHTML = live
    ? "Live verdicts from <code>wk gc --json</code>, read again every 5 seconds. This page is read-only and removes nothing; <code>wk gc --apply</code> does that."
    : "Sample data: this page is not served by <code>wk viz</code>, or the report did not load. Run <code>wk viz</code> to see your own worktrees.";
  render(data);
}

async function load() {
  try {
    const res = await fetch("gc.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()).trim());
    show(await res.json(), true, "");
  } catch (err) {
    show(SAMPLE, false, "gc.json did not load (" + err.message + ").");
  }
}

load();
setInterval(load, 5000);
</script>
